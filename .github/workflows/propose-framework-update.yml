name: Propose framework update

on:
  workflow_dispatch:
    inputs:
      framework_version:
        description: Framework version approved for proposal
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate reviewed local proposal
        run: |
          python tools/bootstrap.py --help
          echo "Run bootstrap.py with the approved source, version, policy, and dry-run in the consumer repository before opening a PR."
      - name: Human review gate
        run: echo "This workflow prepares validation only; a consumer-specific reviewed proposal must be used to create a PR."
