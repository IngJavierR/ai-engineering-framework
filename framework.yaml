            ".github/skills/liquibase-versioning/SKILL.md",
            ".github/skills/liquibase-versioning/references/xml-conventions.md"
          ]
        },
        "frontend-ui-design": {
          "dependencies": [],
          "artifacts": [
            ".github/skills/frontend-ui-design/SKILL.md",
            ".github/skills/frontend-ui-design/references/input-interpretation.md",
            ".github/skills/frontend-ui-design/references/mockup-conversion.md",
